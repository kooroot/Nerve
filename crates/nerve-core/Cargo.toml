[package]
name = "nerve-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
fs2.workspace = true
globset.workspace = true
hmac.workspace = true
libc.workspace = true
nerve-adapter = { path = "../nerve-adapter" }
nerve-config = { path = "../nerve-config" }
nerve-patch = { path = "../nerve-patch" }
nerve-types = { path = "../nerve-types" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ulid.workspace = true
uuid.workspace = true

# H5/H6: Landlock and seccomp-bpf are Linux-only. These dependencies are gated to
# Linux so non-Linux builds neither pull nor compile them; the corresponding
# `nerve_core::sandbox` code is `#[cfg(target_os = "linux")]`.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

# H9: owner-only DACL on the Windows RPC token file (parity with the Unix
# 0o600 guard). Windows-only; `nerve_core::rpc`'s Win32 path is `#[cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
async-trait.workspace = true
