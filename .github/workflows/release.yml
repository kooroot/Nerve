name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to package, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p nerve-cli --target ${{ matrix.target }}

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG}"
          asset="nerve-${version}-${{ matrix.target }}"
          latest_asset="nerve-${{ matrix.target }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/nv" "dist/${asset}/nv"
          cp README.md CHANGELOG.md scripts/install.sh "dist/${asset}/"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          cp "dist/${asset}.tar.gz" "dist/${latest_asset}.tar.gz"

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          $asset = "nerve-$version-${{ matrix.target }}"
          $latestAsset = "nerve-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$asset" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nv.exe" "dist/$asset/nv.exe"
          Copy-Item README.md,CHANGELOG.md,scripts/install.ps1 "dist/$asset/"
          Compress-Archive -Path "dist/$asset/*" -DestinationPath "dist/$asset.zip"
          Copy-Item "dist/$asset.zip" "dist/$latestAsset.zip"

      - name: Package Installers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p dist
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Upload Binary Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nerve-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/nerve-${{ matrix.target }}.${{ matrix.archive }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          overwrite_files: true

      - name: Upload Installer Assets
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install.sh
            dist/install.ps1
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          overwrite_files: true
