[workspace]
members = [
    "crates/nerve-adapter",
    "crates/nerve-cli",
    "crates/nerve-config",
    "crates/nerve-core",
    "crates/nerve-patch",
    "crates/nerve-tui",
    "crates/nerve-types",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kooroot/Nerve"
version = "1.0.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
fs2 = "0.4"
globset = "0.4"
# H5: Linux Landlock LSM filesystem layer (pure-Rust, no C link). Used only on
# Linux via a target-specific dependency; cross-compiles cleanly for clippy.
landlock = "0.4"
libc = "0.2"
# H6: Linux seccomp-bpf syscall denylist (pure-Rust, no C link; the rust-vmm
# crate behind Firecracker's jailer). Linux-only target dependency, like
# `landlock`; cross-compiles cleanly for clippy.
seccompiler = "0.5"
# H9: Win32 security APIs for the Windows-only owner-only DACL on the RPC token
# file (parity with the Unix 0o600 guard). Windows-only target dependency;
# cross-compiles cleanly for clippy on the macOS dev host (no link needed).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
hmac = "0.12"
rand = "0.8"
ratatui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
subtle = "2.6"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1.1", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
